app:
  name: "Equity Market Analysis Dashboard"
  version: "1.0.0"
  environment: ${ENVIRONMENT:local}   # local | databricks | production

api:
  host: "0.0.0.0"
  port: 8000
  workers: 4
  cache_ttl_seconds: 60
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:8080"
    - "*"

data:
  equity_data_path: ${EQUITY_DATA_PATH:data/raw/equities}
  output_path: ${OUTPUT_PATH:data/output}
  report_path: ${REPORT_PATH:data/reports}
  universe_size: 500
  lookback_days: 1825   # 5 years of daily data

spark:
  app_name: "EquityMarketAnalysis"
  master: ${SPARK_MASTER:local[*]}
  executor_memory: "4g"
  driver_memory: "2g"
  shuffle_partitions: 200
  adaptive_execution: true
  delta_enabled: true
  log_level: "WARN"

analytics:
  risk_free_rate: 0.05          # annualised
  trading_days_per_year: 252
  var_confidence_levels: [0.90, 0.95, 0.99]
  scenario_shocks:
    bull:
      market_return: 0.25
      volatility_multiplier: 0.75
      correlation_shift: -0.10
    base:
      market_return: 0.08
      volatility_multiplier: 1.00
      correlation_shift: 0.00
    bear:
      market_return: -0.30
      volatility_multiplier: 1.80
      correlation_shift: 0.35
  rolling_windows: [20, 60, 120, 252]

reporting:
  formats: ["html", "pdf", "excel"]
  template_dir: "src/reporting/templates"
  logo_path: "dashboard/static/img/logo.png"
  sections:
    - market_summary
    - top_performers
    - risk_metrics
    - scenario_analysis
    - sector_breakdown

logging:
  level: ${LOG_LEVEL:INFO}
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {name}:{function}:{line} | {message}"
  rotation: "100 MB"
  retention: "30 days"
